version: '3.8'

services:
  # 1. Base de données PostgreSQL
  postgres-db:
    image: postgres:15
    container_name: lemark_postgres
    restart: always
    environment:
      POSTGRES_USER: lemark_admin
      POSTGRES_PASSWORD: lemark_admin
      POSTGRES_DB: lemark_catalogue
    ports:
      - "5432:5432"
    volumes:
      - lemark_data:/var/lib/postgresql/data
      - ./backend/base_donnees/initialisation:/docker-entrypoint-initdb.d

  # 2. Backend Quarkus
  backend:
    build:
      context: ./backend/serveur_java
      dockerfile: Dockerfile
    container_name: lemark_backend
    restart: always
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-db:5432/lemark_catalogue
      QUARKUS_DATASOURCE_USERNAME: lemark_admin
      QUARKUS_DATASOURCE_PASSWORD: lemark_admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db

  # 3. Frontend React / Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lemark_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  lemark_data:
  